<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>図書館を探す - カーリル図書館API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 図書館を探す</h1>
      <p class="subtitle">地名や現在地から近くの図書館を検索します</p>
    </header>

    <div class="search-section">
      <div class="search-bar">
        <input
          type="text"
          id="keywordInput"
          placeholder="地名で探す（例：新宿区、大阪市、札幌）"
          autocomplete="off"
        >
        <button id="keywordSearchBtn" class="primary-btn">検索</button>
      </div>
      <div class="search-meta">
        <button id="geoBtn" class="geo-btn">📍 現在地を使う</button>
        <div class="limit-control">
          <label for="limitSelect">表示件数</label>
          <select id="limitSelect">
            <option value="5">5件</option>
            <option value="10" selected>10件</option>
            <option value="20">20件</option>
          </select>
        </div>
      </div>
    </div>

    <div id="status" class="status" hidden></div>

    <div id="results" class="results"></div>
  </div>

  <footer>
    <p>
      Powered by <a href="https://calil.jp/doc/api.html" target="_blank" rel="noopener">カーリル図書館API</a>
      &nbsp;／&nbsp;
      地名検索: <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener">Nominatim / OpenStreetMap</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
